name: Zig master

# Early warning for the next Zig upgrade (docs/UPGRADING_ZIG.md): builds and tests against Zig's
# nightly. A failure here blocks nothing; it shows what the upgrade will have to fix.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: master

      - name: Show the Zig version
        run: zig version

      - name: Type-check the app and the simulator
        run: zig build check

      - name: Run the unit tests
        run: zig build test
